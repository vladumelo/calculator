<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор покрытий по изображению</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Калькулятор покрытий по изображению</h1>
        <p>Масштаб, обрисовка участков, zoom/pan/fullscreen и редактируемая смета.</p>
      </header>

      <section class="layout" id="editorRoot">
        <aside class="toolbar panel">
          <h3>Инструменты</h3>
          <label>Покрытие
            <select id="materialSelect"></select>
          </label>

          <div class="tool-group">
            <button id="toolDraw" title="Режим рисования">Рисование</button>
            <button id="toolScale" title="Режим задания масштаба">Масштаб</button>
            <button id="toolPan" title="Рука / панорамирование">Рука</button>
          </div>

          <label>Реальная дистанция, м
            <input id="realDistanceInput" type="number" min="0.01" step="0.01" value="10" />
          </label>
          <div id="scaleInfo" class="hint">Масштаб не задан</div>

          <div class="tool-group">
            <button id="undoPoint" title="Удалить последнюю точку (Backspace/Delete)">Отменить точку</button>
            <button id="clearContour" title="Очистить текущий контур (Esc)">Очистить контур</button>
            <button id="closeContour" title="Замкнуть контур (Enter)">Замкнуть контур</button>
            <button id="deleteSelected" title="Удалить выбранный участок">Удалить участок</button>
          </div>

          <div class="tool-group">
            <button id="zoomIn" title="Увеличить (+)">+</button>
            <button id="zoomOut" title="Уменьшить (-)">−</button>
            <button id="zoom100" title="100%">100%</button>
            <button id="fitView" title="Вписать в экран">Вписать</button>
            <button id="resetView" title="Сбросить вид">Сброс</button>
            <button id="fullscreen" title="На весь экран (F)">Fullscreen</button>
          </div>

          <label>Загрузить изображение
            <input id="imageInput" type="file" accept="image/*" />
          </label>

          <h3>Покрытия</h3>
          <table>
            <thead><tr><th>№</th><th>Название</th><th>Цвет</th><th>₽/м²</th></tr></thead>
            <tbody id="materialsTable"></tbody>
          </table>
          <div class="add-material">
            <input id="mNumber" placeholder="№" />
            <input id="mName" placeholder="Название" />
            <input id="mColor" type="color" value="#3b82f6" />
            <input id="mPrice" type="number" min="0" step="1" value="1000" />
            <button id="addMaterial">Добавить покрытие</button>
          </div>
        </aside>

        <section class="canvas-panel panel" id="canvasPanel">
          <canvas id="canvas"></canvas>
        </section>
      </section>

      <section class="panel">
        <h2>Смета по участкам</h2>
        <table>
          <thead>
            <tr>
              <th>Участок</th><th>Покрытие</th><th>№ покрытия</th><th>Площадь, м²</th><th>Периметр, м</th><th>₽/м²</th><th>Стоимость, ₽</th><th>Действия</th>
            </tr>
          </thead>
          <tbody id="estimateBody"></tbody>
          <tfoot><tr><td colspan="6">Итого</td><td id="estimateTotal">0 ₽</td><td></td></tr></tfoot>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
